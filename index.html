<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Smash Court</title>
<style>
:root{--bg:#071018;--panel:#0e1b26;--panel2:#132634;--line:#284252;--text:#f5fbff;--muted:#9bb0bd;--accent:#53e6a8;--gold:#ffd66b;--danger:#ff6978}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}.app{width:100%;height:100%;position:relative}
.menu{height:100%;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 15%,#17394a 0,#071018 55%)}
.menu-card{width:min(720px,94vw);max-height:94vh;overflow:auto;background:rgba(14,27,38,.92);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 20px 80px #0008}
.logo{display:flex;align-items:center;gap:12px;font-weight:900;font-size:32px}.logo span{color:var(--accent)}.subtitle{color:var(--muted);margin:4px 0 22px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.cardbtn{background:linear-gradient(145deg,#173140,#0d1c27);border:1px solid #315061;border-radius:16px;padding:18px;text-align:left;min-height:90px}.cardbtn b{display:block;font-size:18px}.cardbtn small{color:var(--muted)}.cardbtn:hover{border-color:var(--accent)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{padding:7px 10px;border-radius:999px;background:#172b38;color:var(--muted);font-size:12px}
.panel{background:#0c1923;border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}.panel h3{margin:0 0 8px}.stat{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #1b303d}.stat:last-child{border:0}
.game{display:none;width:100%;height:100%;position:relative;background:#061018}.game.active{display:block}
#scene{position:absolute;inset:0}.hud{position:absolute;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}.scorebox{background:#07151fe8;border:1px solid #355363;border-radius:13px;padding:6px 10px;min-width:130px;text-align:center}.scorebox .names{font-size:10px;color:var(--muted)}.score{font-size:25px;font-weight:900;line-height:1}.centerhud{text-align:center}.gamebadge{background:#07151fe8;border:1px solid #355363;padding:6px 10px;border-radius:999px;font-size:11px}.serve{font-size:10px;color:var(--accent);margin-top:4px}.pause{pointer-events:auto;background:#122733;border:1px solid #456273;padding:7px 10px;border-radius:10px}
.call{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-size:38px;font-weight:1000;text-shadow:0 4px 16px #000;opacity:0;z-index:6;transition:.15s}.call.show{opacity:1}
.controls{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));z-index:5;display:flex;justify-content:space-between;align-items:end;padding:0 14px;pointer-events:none}.joystick{width:116px;height:116px;border-radius:50%;background:#ffffff10;border:2px solid #ffffff2a;position:relative;pointer-events:auto}.knob{width:48px;height:48px;border-radius:50%;background:#dfffee;color:#062014;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 5px 18px #0008}.shots{display:grid;grid-template-columns:repeat(3,72px);gap:7px;pointer-events:auto}.shot{height:52px;border-radius:13px;background:#112733e8;border:1px solid #3c5c6d;font-size:11px;font-weight:800}.shot.main{background:#2f9f79}.shot:active{transform:scale(.96)}
.stamina{position:absolute;left:50%;bottom:9px;transform:translateX(-50%);width:150px;height:7px;background:#ffffff22;border-radius:9px;z-index:5}.stamina i{display:block;height:100%;width:100%;background:var(--accent);border-radius:inherit}
.modal{position:absolute;inset:0;background:#0009;display:none;align-items:center;justify-content:center;z-index:20;padding:18px}.modal.show{display:flex}.modalbox{width:min(500px,92vw);background:#0d1b25;border:1px solid #355364;border-radius:20px;padding:20px}.modalbox h2{margin-top:0}.action{background:var(--accent);color:#061b12;padding:11px 15px;border-radius:11px;font-weight:900}.secondary{background:#172b38;padding:11px 15px;border-radius:11px}.char-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:55vh;overflow:auto}.char{background:#142734;border:1px solid #2e4b5b;border-radius:12px;padding:9px}.char.selected{border-color:var(--accent)}.avatar{height:60px;border-radius:10px;background:linear-gradient(135deg,#355d72,#182b37);display:grid;place-items:center;font-size:28px}
@media (orientation:portrait){.game.active:before{content:'ROTATE TO LANDSCAPE';position:absolute;inset:0;z-index:50;background:#071018;display:grid;place-items:center;font-weight:900;letter-spacing:2px;font-size:18px}.controls{display:none}}
@media (max-width:700px) and (orientation:landscape){.shots{grid-template-columns:repeat(3,64px);gap:5px}.shot{height:46px}.joystick{width:96px;height:96px}.knob{width:42px;height:42px}.scorebox{min-width:108px}.score{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<section id="menu" class="menu">
<div class="menu-card">
<div class="logo">🏸 <span>SMASH</span> COURT</div>
<div class="subtitle">3D badminton foundation • singles • doubles • bot practice</div>
<div class="grid">
<button class="cardbtn" onclick="openSetup('singles')"><b>Singles</b><small>1 vs 1 regulation court</small></button>
<button class="cardbtn" onclick="openSetup('doubles')"><b>Doubles</b><small>2 vs 2 with AI partners</small></button>
<button class="cardbtn" onclick="showChars()"><b>Characters</b><small>Choose your player</small></button>
<button class="cardbtn" onclick="showProfile()"><b>Profile</b><small>Progress, XP and stats</small></button>
<button class="cardbtn" onclick="showChallenges()"><b>Challenges</b><small>Daily objectives</small></button>
<button class="cardbtn" onclick="showLocal()"><b>Local / Online</b><small>Room prototype and network plan</small></button>
</div>
<div class="panel"><h3>Quick progress</h3><div class="row"><span class="pill">Level <b id="level">1</b></span><span class="pill">Coins <b id="coins">1000</b></span><span class="pill">Rank <b>Bronze III</b></span></div></div>
</div></section>
<section id="game" class="game">
<div id="scene"></div>
<div class="hud">
<div class="scorebox"><div class="names">YOU <span id="oppname">VS BOT</span></div><div class="score"><span id="youScore">0</span> — <span id="botScore">0</span></div></div>
<div class="centerhud"><div class="gamebadge">GAME <span id="gameNo">1</span> / 3</div><div class="serve" id="serveText">YOU SERVE • RIGHT</div></div>
<button class="pause" onclick="pauseGame()">Ⅱ</button>
</div>
<div id="call" class="call"></div>
<div class="controls">
<div id="joy" class="joystick"><div id="knob" class="knob"></div></div>
<div class="shots">
<button class="shot" onclick="playerShot('clear')">CLEAR</button><button class="shot" onclick="playerShot('drop')">DROP</button><button class="shot main" onclick="playerShot('smash')">SMASH</button>
<button class="shot" onclick="playerShot('drive')">DRIVE</button><button class="shot" onclick="playerShot('lift')">LIFT</button><button class="shot" onclick="playerShot('net')">NET</button>
</div></div>
<div class="stamina"><i id="stamina"></i></div>
<div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
</section></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const state={mode:'singles',game:1,you:0,bot:0,paused:false,serving:'you',serveSide:'Right',rally:0,stamina:100,selected:0,coins:+localStorage.coins||1000,xp:+localStorage.xp||0,level:+localStorage.level||1};
const chars=[
['Kai','PH','Power','⚡'],['Mina','JP','Control','🌸'],['Rafi','ID','Speed','🔥'],['Ari','MY','Defense','🛡️'],['Lina','CN','Net Play','🎯'],['Noah','GB','All-round','🏸'],
['Sora','KR','Agility','💨'],['Maya','IN','Smash','⚡'],['Theo','FR','Tactics','🧠'],['Nia','US','Stamina','💪'],['Ren','TH','Deception','🎭'],['Asha','SG','Precision','✨']
];
let scene,camera,renderer,clock,player,bot,partner,bot2,shuttle,net,raf;
function save(){localStorage.coins=state.coins;localStorage.xp=state.xp;localStorage.level=state.level}
function addXP(n){state.xp+=n;if(state.xp>=state.level*500){state.xp-=state.level*500;state.level++;state.coins+=500}save()}
function modal(html){$('modalbox').innerHTML=html;$('modal').classList.add('show')}
function closeModal(){$('modal').classList.remove('show')}
function showChars(){modal('<h2>Characters</h2><p class="subtitle">12 launch-ready profiles. Stats are balanced by role.</p><div class="char-grid">'+chars.map((c,i)=>'<div class="char '+(i===state.selected?'selected':'')+'" onclick="selectChar('+i+')"><div class="avatar">'+c[3]+'</div><b>'+c[0]+'</b><small>'+c[1]+' • '+c[2]+'</small><div class="stat"><span>Overall</span><b>'+[78,80,79,77,82,81,84,83,80,79,82,85][i]+'</b></div></div>').join('')+'</div><br><button class="secondary" onclick="closeModal()">Close</button>')}
function selectChar(i){state.selected=i;showChars()}
function showProfile(){modal('<h2>Player Profile</h2><div class="stat"><span>Level</span><b>'+state.level+'</b></div><div class="stat"><span>XP</span><b>'+state.xp+'</b></div><div class="stat"><span>Rank</span><b>Bronze III</b></div><div class="stat"><span>Coins</span><b>'+state.coins+'</b></div><div class="stat"><span>Selected</span><b>'+chars[state.selected][0]+'</b></div><br><button class="secondary" onclick="closeModal()">Close</button>')}
function showChallenges(){modal('<h2>Daily Challenges</h2><p>✓ Play 1 match — <b>100 XP</b></p><p>○ Hit 5 smashes — <b>150 coins</b></p><p>○ Win a rally of 10+ shots — <b>200 XP</b></p><p class="subtitle">Server-backed daily rotation will be connected in the online backend phase.</p><button class="secondary" onclick="closeModal()">Close</button>')}
function showLocal(){modal('<h2>Multiplayer</h2><p><b>Local Wi-Fi / hotspot</b></p><p>Room discovery, ready checks and synchronized match state are reserved for the network phase. The current build provides the full offline gameplay foundation.</p><p><b>Online</b><br>Server-authoritative matchmaking will be connected after the core rules/AI pass.</p><button class="secondary" onclick="closeModal()">Close</button>')}
function openSetup(mode){state.mode=mode;modal('<h2>'+mode.toUpperCase()+' MATCH</h2><p>Choose bot difficulty.</p><div class="row"><button class="secondary" onclick="startGame(1)">Bronze</button><button class="secondary" onclick="startGame(2)">Silver</button><button class="secondary" onclick="startGame(3)">Gold</button><button class="secondary" onclick="startGame(4)">Platinum</button><button class="secondary" onclick="startGame(5)">Diamond</button></div><p class="subtitle">Regulation scoring: 21, win by 2, cap 30. Deciding game changes ends at 11.</p><button class="secondary" onclick="closeModal()">Cancel</button>')}
function startGame(diff){closeModal();$('menu').style.display='none';$('game').classList.add('active');state.diff=diff;state.game=1;state.you=0;state.bot=0;state.serving='you';state.rally=0;state.stamina=100;init3D();updateHUD();showCall('READY',600)}
function makePlayer(color){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.22,.72,6,12),new THREE.MeshStandardMaterial({color}));body.position.y=.65;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.18,12,10),new THREE.MeshStandardMaterial({color:0xf0c7a5}));head.position.y=1.2;g.add(head);const racket=new THREE.Group();const h=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.38,8),new THREE.MeshStandardMaterial({color:0xeeeeee}));h.rotation.z=Math.PI/2;racket.add(h);const r=new THREE.Mesh(new THREE.TorusGeometry(.13,.018,8,24),new THREE.MeshStandardMaterial({color:0xffffff}));r.position.x=.22;racket.add(r);racket.rotation.z=-.3;racket.position.set(.18,.78,.08);g.add(racket);return g}
function init3D(){
cancelAnimationFrame(raf);scene=new THREE.Scene();scene.background=new THREE.Color(0x071018);
camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,3.2,6.2);camera.lookAt(0,.6,0);
renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;$('scene').innerHTML='';$('scene').appendChild(renderer.domElement);
const amb=new THREE.HemisphereLight(0xddefff,0x15202a,2.2);scene.add(amb);const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(3,8,4);light.castShadow=true;scene.add(light);
const floor=new THREE.Mesh(new THREE.BoxGeometry(9,.12,16),new THREE.MeshStandardMaterial({color:0x176b59,roughness:.65}));floor.receiveShadow=true;floor.position.y=-.06;scene.add(floor);
const court=new THREE.Mesh(new THREE.BoxGeometry(6.1,.02,13.4),new THREE.MeshStandardMaterial({color:0x16806a,roughness:.55}));court.position.y=.01;scene.add(court);
function line(x,z,sx,sz){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,.025,sz),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(x,.04,z);scene.add(m)}
line(0,-6.7,6.1,.035);line(0,6.7,6.1,.035);line(-3.05,0,.035,13.4);line(3.05,0,.035,13.4);line(-2.59,0,.025,13.4);line(2.59,0,.025,13.4);line(0,-1.98,5.18,.025);line(0,1.98,5.18,.025);line(0,0,.025,13.4);
net=new THREE.Mesh(new THREE.BoxGeometry(6.3,1.55,.035),new THREE.MeshBasicMaterial({color:0x18232a,transparent:true,opacity:.6}));net.position.y=.775;scene.add(net);
[-3.1,3.1].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.7,10),new THREE.MeshStandardMaterial({color:0xdddddd}));p.position.set(x,.85,0);scene.add(p)});
player=makePlayer(0x3ee0a1);player.position.set(0,.05,5.0);scene.add(player);bot=makePlayer(0xff6978);bot.position.set(0,.05,-5);scene.add(bot);
if(state.mode==='doubles'){partner=makePlayer(0x50a7ff);partner.position.set(-1.7,.05,4.5);scene.add(partner);bot2=makePlayer(0xffc85a);bot2.position.set(1.7,.05,-4.5);scene.add(bot2)}
shuttle=new THREE.Mesh(new THREE.SphereGeometry(.07,10,8),new THREE.MeshStandardMaterial({color:0xf5f5e8}));shuttle.position.set(0,1.2,3);scene.add(shuttle);
clock=new THREE.Clock();animate()
}
let vel=new THREE.Vector3(),target=new THREE.Vector3();
function animate(){raf=requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);if(!state.paused&&player){vel.lerp(target,.18);player.position.addScaledVector(vel,dt*3.2);player.position.x=Math.max(-2.6,Math.min(2.6,player.position.x));player.position.z=Math.max(2.2,Math.min(6.1,player.position.z));state.stamina=Math.max(0,state.stamina-Math.abs(vel.x+vel.z)*dt*2);if(state.stamina<25)state.stamina+=dt*4;camera.position.x+=(player.position.x-camera.position.x)*.08;camera.position.z+=(player.position.z+6.2-camera.position.z)*.08;camera.lookAt(player.position.x*.2,.65,0);$('stamina').style.width=state.stamina+'%';renderer.render(scene,camera)}}
function updateHUD(){$('youScore').textContent=state.you;$('botScore').textContent=state.bot;$('gameNo').textContent=state.game;$('serveText').textContent=(state.serving==='you'?'YOU SERVE':'BOT SERVES')+' • '+((state.serving==='you'?state.you:state.bot)%2===0?'RIGHT':'LEFT')}
function showCall(t,ms=800){const c=$('call');c.textContent=t;c.classList.add('show');setTimeout(()=>c.classList.remove('show'),ms)}
function serviceCorrect(){return state.serving==='you' ? state.you%2===0 : state.bot%2===0}
function playerShot(type){if(state.paused)return;if(state.serving==='you'&&state.rally===0){state.rally=1;showCall('SERVE');setTimeout(botReturn,400);return}if(state.rally===0){showCall('WAIT');return}state.rally++;const power={clear:.75,drop:.55,smash:1,drive:.85,lift:.65,net:.45}[type];state.stamina=Math.max(0,state.stamina-power*4);showCall(type.toUpperCase(),220);shuttle.position.set(player.position.x,1.1,1.4);setTimeout(botReturn,260+Math.random()*180)}
function botReturn(){if(state.paused)return;state.rally++;const err=(6-state.diff)*.08;if(Math.random()<err){point('you','OUT');return}const types=['clear','drop','drive','smash','net'];showCall(types[Math.floor(Math.random()*types.length)].toUpperCase(),180);setTimeout(()=>{if(Math.random()<.12+state.diff*.035)point('bot','WINNER');else showCall('RALLY '+state.rally,140)},300)}
function point(who,reason){if(state.paused)return;state[who]++;addXP(10);state.rally=0;state.serving=who;showCall(who==='you'?'POINT YOU':'POINT BOT',700);updateHUD();if(state.you>=21||state.bot>=21){const a=state.you,b=state.bot;if(Math.max(a,b)>=21&&Math.abs(a-b)>=2||a===30||b===30){endGame(a>b?'you':'bot')}}}
function endGame(who){if(who==='you'){showCall('GAME YOU',1000);addXP(150)}else showCall('GAME BOT',1000);setTimeout(()=>{if(state.game<3){state.game++;state.you=0;state.bot=0;state.serving=who;state.rally=0;updateHUD();showCall('GAME '+state.game,900)}else{matchEnd(who)}},1100)}
function matchEnd(who){state.paused=true;modal('<h2>'+ (who==='you'?'🏆 MATCH WON':'MATCH OVER')+'</h2><p>'+ (who==='you'?'Excellent rally discipline.':'Keep practicing your timing and positioning.')+'</p><p>XP earned has been saved locally.</p><div class="row"><button class="action" onclick="closeModal();restart()">Rematch</button><button class="secondary" onclick="closeModal();exitGame()">Main Menu</button></div>')}
function pauseGame(){state.paused=!state.paused;if(state.paused)modal('<h2>Paused</h2><div class="row"><button class="action" onclick="closeModal();pauseGame()">Resume</button><button class="secondary" onclick="closeModal();restart()">Restart</button><button class="secondary" onclick="closeModal();exitGame()">Menu</button></div>')}
function restart(){state.game=1;state.you=0;state.bot=0;state.serving='you';state.rally=0;state.stamina=100;state.paused=false;updateHUD();showCall('READY',600)}
function exitGame(){state.paused=false;$('game').classList.remove('active');$('menu').style.display='flex';cancelAnimationFrame(raf)}
let dragging=false;function moveJoy(e){const r=$('joy').getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2);const m=Math.min(1,Math.hypot(x,y));const a=Math.atan2(y,x);const dx=Math.cos(a)*m,dy=Math.sin(a)*m;$('knob').style.transform='translate(calc(-50% + '+dx*30+'px),calc(-50% + '+dy*30+'px))';target.set(dx*2.8,0,-dy*2.8)}
$('joy').addEventListener('pointerdown',e=>{dragging=true;$('joy').setPointerCapture(e.pointerId);moveJoy(e)});$('joy').addEventListener('pointermove',e=>{if(dragging)moveJoy(e)});$('joy').addEventListener('pointerup',()=>{dragging=false;$('knob').style.transform='translate(-50%,-50%)';target.set(0,0,0)});
addEventListener('resize',()=>{if(renderer){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}})
$('level').textContent=state.level;$('coins').textContent=state.coins;
</script>
</body></html>
